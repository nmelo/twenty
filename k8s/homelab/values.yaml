# Helm values for deploying Twenty to the homelab k3s cluster.
# Chart: packages/twenty-docker/helm/twenty
# Installs into ns "twenty", exposed at https://twenty.ker4s.com via traefik
# with TLS from the letsencrypt-cloudflare ClusterIssuer (DNS-01).
# Bundled Postgres + Redis (isolated from the shared `postgres` namespace).
# Storage: local-path (default k3s); PVCs pin pods to whichever node binds first.
# Image: built locally from this fork, pushed to registry.ker4s.com:30095.

image:
  repository: registry.ker4s.com:30095/twenty
  tag: homelab-v1
  pullPolicy: IfNotPresent

server:
  replicaCount: 1
  # Pin to amd64 node; our images are single-arch amd64.
  nodeSelector:
    kubernetes.io/hostname: workbench
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2048Mi

  ingress:
    enabled: true
    className: traefik
    # acme:true hardcodes letsencrypt-prod — we use our cloudflare DNS-01 issuer instead
    acme: false
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    hosts:
      - host: twenty.ker4s.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: twenty-tls
        hosts:
          - twenty.ker4s.com

  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

worker:
  replicaCount: 1
  nodeSelector:
    kubernetes.io/hostname: workbench
  resources:
    requests:
      cpu: 250m
      memory: 1024Mi
    limits:
      cpu: 2000m
      memory: 2048Mi

db:
  enabled: true
  internal:
    # Mirrored amd64 image in local registry (cluster has mixed arch; we pin
    # workbench which is amd64-only).
    image:
      repository: registry.ker4s.com:30095/twenty-postgres-spilo
      tag: v0.43.5-amd64
    persistence:
      enabled: true
      size: 20Gi
    nodeSelector:
      kubernetes.io/hostname: workbench

redisInternal:
  enabled: true
  image:
    repository: registry.ker4s.com:30095/redis-stack-server
    tag: 7.2.0-v10-amd64
    pullPolicy: IfNotPresent
  persistence:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: workbench

storage:
  type: local
